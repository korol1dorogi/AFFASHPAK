# Optional local hooks (CI runs the same checks anyway):
#   pipx install pre-commit && pre-commit install
# Biome uses frontend/node_modules, so run `npm ci` in frontend/ first.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix, --config, backend/pyproject.toml]
        files: ^backend/
      - id: ruff-format
        args: [--config, backend/pyproject.toml]
        files: ^backend/

  - repo: local
    hooks:
      - id: biome
        name: biome check (frontend)
        language: system
        # Biome resolves its config and .gitignore from the cwd, so run it inside frontend/.
        entry: bash -c 'cd frontend && npx --no-install biome check --write --no-errors-on-unmatched --files-ignore-unknown=true "${@#frontend/}"' --
        files: ^frontend/.*\.(ts|tsx|js|jsx|json|css)$
        exclude: ^frontend/src/api/schema\.d\.ts$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
