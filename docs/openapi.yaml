openapi: 3.1.0
info:
  title: Умный кредитный кабинет предпринимателя — API
  version: 1.0.0
  description: |
    Контракт v1 (L1). Источник истины (contract-first, docs/decisions.md D2). Меняет только лид.
    Сверен с текстом кейса (docs/case.md: F1–F12, T1–T7, O1–O8).

    - Фронт генерирует клиент: `npm run gen:api` (frontend/). Бэк валидирует ответы по контракту в тестах.
      Мок: `docker compose --profile mock up -d mock` → http://localhost:4010.
    - Статусы, переходы и роли — docs/state-machine.md; сущности — docs/data-model.md.
    - Деньги, ставки и коэффициенты — строки-десятичные ("900000.00", "0.24"). Ставки — годовые, в долях.
    - Ошибки — единый формат Error. 409: `invalid_transition` (действие недопустимо в статусе)
      или `version_conflict` (заявку изменили, перечитайте).
    - Сессия (cookie sessionid). Небезопасные методы требуют X-CSRFToken = cookie csrftoken
      (GET /api/auth/csrf выставляет cookie). CORS нет, один origin.
    - Клиент видит только данные своей компании, банк — все заявки. Чужой id → 404.
    - `/api/demo/*` существует только на стенде (DEMO_MODE=1), иначе 404.
servers:
  - url: /
security:
  - session: []
tags:
  - name: system
  - name: auth
  - name: company
  - name: products
  - name: applications
  - name: notifications
  - name: bank
  - name: assistant
  - name: demo

paths:
  # ───────────────────────────── system ─────────────────────────────
  /api/health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Живость API и базы
      security: []
      responses:
        "200":
          description: Всё работает
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
              example: { status: ok, database: ok }
        "503":
          description: База недоступна
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
              example: { status: degraded, database: unavailable }

  /api/ready:
    get:
      tags: [system]
      operationId: getReadiness
      summary: Готовность к трафику (база, очередь, симуляторы)
      security: []
      responses:
        "200":
          description: Готов
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
        "503":
          description: Не готов
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }

  # ───────────────────────────── auth ─────────────────────────────
  /api/auth/csrf:
    get:
      tags: [auth]
      operationId: getCsrf
      summary: Выставить cookie csrftoken
      security: []
      responses:
        "200":
          description: Cookie выставлена
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CsrfToken" }

  /api/auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Регистрация клиента без подтверждения почты; сразу входит
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: Создан и вошёл
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Вход по логину и паролю (сессия)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Вход выполнен
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Выход
      responses:
        "204": { description: Сессия завершена }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Текущий пользователь, его сторона и роль
      responses:
        "200":
          description: Пользователь
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ───────────────────────────── company ─────────────────────────────
  /api/company/lookup:
    get:
      tags: [company]
      operationId: lookupCompany
      summary: Данные из ЕГРЮЛ/ЕГРИП по ИНН (симулятор) — для автозаполнения
      parameters:
        - name: inn
          in: query
          required: true
          schema: { $ref: "#/components/schemas/Inn" }
      responses:
        "200":
          description: Найдено в реестре
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistryRecord" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/SourceUnavailable" }

  /api/company:
    get:
      tags: [company]
      operationId: getCompany
      summary: Компания текущего пользователя (404 — ещё не создана)
      responses:
        "200":
          description: Компания
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Company" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [company]
      operationId: createCompany
      summary: Создать компанию по ИНН; реквизиты — из ЕГРЮЛ, создатель становится signatory
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompanyCreate" }
      responses:
        "201":
          description: Компания создана
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Company" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/SourceUnavailable" }
    patch:
      tags: [company]
      operationId: updateCompany
      summary: Изменить редактируемые поля (реквизиты из реестра не редактируются)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompanyUpdate" }
      responses:
        "200":
          description: Обновлённая компания
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Company" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/company/members:
    get:
      tags: [company]
      operationId: listCompanyMembers
      summary: Сотрудники компании и их роли
      responses:
        "200":
          description: Сотрудники
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Member" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/company/invitations:
    get:
      tags: [company]
      operationId: listCompanyInvitations
      summary: Приглашения компании, ждущие ответа
      responses:
        "200":
          description: Приглашения
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Invitation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [company]
      operationId: inviteCompanyMember
      summary: Пригласить сотрудника по логину (только signatory)
      description: |
        Сотрудник появится в компании, только когда сам примет приглашение (acceptInvitation).
        Ответ одинаковый для любого логина правильного формата — есть ли такой клиент, работает ли
        он в другой компании или это сотрудник банка, подписант не узнаёт (docs/security.md).
        409 — логин уже в этой компании (member_exists) или уже приглашён (invitation_exists).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvitationCreate" }
      responses:
        "201":
          description: Приглашение создано
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invitation" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/company/invitations/{invitation_id}:
    parameters:
      - name: invitation_id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    delete:
      tags: [company]
      operationId: cancelCompanyInvitation
      summary: Отозвать приглашение, пока на него не ответили (только signatory)
      responses:
        "204": { description: Отозвано }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/invitations:
    get:
      tags: [company]
      operationId: listMyInvitations
      summary: Приглашения в компании, адресованные текущему пользователю (403 — сотрудник банка)
      responses:
        "200":
          description: Приглашения, ждущие ответа
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/IncomingInvitation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/invitations/{invitation_id}/accept:
    parameters:
      - name: invitation_id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    post:
      tags: [company]
      operationId: acceptInvitation
      summary: Принять приглашение и войти в компанию (409 — пользователь уже работает в компании)
      responses:
        "200":
          description: Компания, в которую вошёл пользователь
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Company" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/invitations/{invitation_id}/decline:
    parameters:
      - name: invitation_id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    post:
      tags: [company]
      operationId: declineInvitation
      summary: Отклонить приглашение
      responses:
        "204": { description: Отклонено }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/company/members/{member_id}:
    parameters:
      - name: member_id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    delete:
      tags: [company]
      operationId: removeCompanyMember
      summary: Убрать сотрудника (только signatory; себя убрать нельзя)
      responses:
        "204": { description: Убран }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/company/metrics:
    get:
      tags: [company]
      operationId: getCompanyMetrics
      summary: Последний финансовый снимок и ключевые метрики с пояснениями
      responses:
        "200":
          description: Снимок (может отсутствовать) и метрики в формате Reason
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyMetrics" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/company/integrations/{source}/connect:
    post:
      tags: [company]
      operationId: connectIntegration
      summary: Подключить источник данных (симулятор; данные помечены «демо»)
      parameters:
        - name: source
          in: path
          required: true
          schema: { $ref: "#/components/schemas/IntegrationSource" }
      responses:
        "200":
          description: Подключено, создан снимок
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntegrationConnectResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/SourceUnavailable" }

  # ───────────────────────────── products ─────────────────────────────
  /api/products:
    get:
      tags: [products]
      operationId: listProducts
      summary: Каталог кредитных продуктов
      security: []
      responses:
        "200":
          description: Продукты
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Product" }

  /api/products/{code}:
    get:
      tags: [products]
      operationId: getProduct
      summary: Продукт
      security: []
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Продукт
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/recommendations:
    post:
      tags: [products]
      operationId: createRecommendations
      summary: Подбор «Что вам нужно?» — продукт, сумма, платёж и причины по данным компании
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecommendationRequest" }
      responses:
        "200":
          description: Ранжированные предложения и стоп-факторы
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecommendationResult" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/calculators/annuity:
    post:
      tags: [products]
      operationId: calculateAnnuity
      summary: Аннуитетный калькулятор с графиком платежей
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnnuityRequest" }
      responses:
        "200":
          description: Платёж, итог, переплата, график
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnnuityResult" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ───────────────────────────── applications (client) ─────────────────────────────
  /api/applications:
    get:
      tags: [applications]
      operationId: listApplications
      summary: Заявки компании текущего пользователя (новые сверху)
      responses:
        "200":
          description: Заявки
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Application" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [applications]
      operationId: createApplication
      summary: Создать черновик (signatory или preparer)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplicationCreate" }
      responses:
        "201":
          description: Черновик создан
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Application" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/applications/{id}:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
    get:
      tags: [applications]
      operationId: getApplication
      summary: Заявка с офером, открытыми запросами банка и доступными действиями
      responses:
        "200":
          description: Заявка
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [applications]
      operationId: updateApplication
      summary: Изменить черновик (только draft; version обязательна — автосохранение)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplicationUpdate" }
      responses:
        "200":
          description: Обновлённая заявка
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationDetail" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/applications/{id}/submit:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
    post:
      tags: [applications]
      operationId: submitApplication
      summary: Отправить (draft → submitted). Идемпотентно по Idempotency-Key
      description: >-
        Вместе с отправкой подписант даёт согласие на запрос в бюро кредитных историй (218-ФЗ):
        без `bki_consent: true` и актуальной `consent_version` — 400, заявка остаётся черновиком.
        Согласие сохраняется и пишется в журнал событием `consent_given`.
        Поля, без которых банк не начнёт проверку (продукт, цель от 10 символов, сумма и срок в
        границах продукта, сумма отгрузки у факторинга), проверяются здесь же — 400 с ошибкой по
        полю: после отправки их уже не изменить. Документы можно догрузить и после отправки.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitRequest" }
      responses:
        "200":
          description: Отправлена (или повтор с тем же ключом — тот же ответ)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationDetail" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/applications/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
    post:
      tags: [applications]
      operationId: cancelApplication
      summary: Отозвать заявку
      responses:
        "200":
          description: Отозвана
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/applications/{id}/hand-off:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
    post:
      tags: [applications]
      operationId: handOffApplication
      summary: Передать готовый черновик подписанту (XP5)
      description: |
        Готовит заявку `preparer` (бухгалтер), отправляет только `signatory`. Когда черновик
        готов, бухгалтер передаёт его подписантам: в журнале — событие `handed_off`, каждому
        подписанту компании — уведомление. Статус и `version` не меняются; повторная передача —
        напоминание. Доступно только в `draft` и только бухгалтеру (`hand_off` в
        `available_actions`). Поля проверяются так же, как при отправке (400 с ошибкой по полю),
        кроме согласия на запрос в БКИ — его даёт подписант при отправке.
      responses:
        "200":
          description: Передано, подписанты уведомлены
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationDetail" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/applications/{id}/events:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
    get:
      tags: [applications]
      operationId: listApplicationEvents
      summary: Таймлайн заявки для клиента (без внутренних комментариев банка)
      responses:
        "200":
          description: События по возрастанию времени
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ApplicationEvent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/applications/{id}/decision:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
    get:
      tags: [applications]
      operationId: getApplicationDecision
      summary: Последнее решение с причинами и «что улучшить» (404 — решения ещё нет)
      responses:
        "200":
          description: Решение
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Decision" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/applications/{id}/offer/accept:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
    post:
      tags: [applications]
      operationId: acceptOffer
      summary: Принять активный оффер или контроффер (offer → signing; signatory); истёкший оффер — 409
      responses:
        "200":
          description: Оффер принят
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/applications/{id}/offer/decline:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
    post:
      tags: [applications]
      operationId: declineOffer
      summary: Отказаться от оффера (offer → cancelled; signatory)
      responses:
        "200":
          description: Оффер отклонён
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/applications/{id}/what-if:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
    post:
      tags: [applications]
      operationId: calculateWhatIf
      summary: «Что если» под оффером — платёж, DSCR и допустимая сумма на другой срок (расчёт, не решение)
      description: |
        Только расчёт: оффер банка не меняется. Ставка — из действующего оффера, допустимая сумма —
        те же правила, что у подбора (credit_math: max_loan_by_dscr, лимиты продукта). Доступно при
        действующем оффере на продукт с фиксированным платежом (КПО, инвестиционный кредит, лизинг);
        сумма вне лимитов продукта не ошибка, а fits = false с причиной. Заявки чужой компании — 404.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WhatIfRequest" }
      responses:
        "200":
          description: Расчёт
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WhatIfResult" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/applications/{id}/signature:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
    post:
      tags: [applications]
      operationId: startSignature
      summary: Получить код подписания — показывается на экране (не SMS); повтор выдаёт новый код
      responses:
        "200":
          description: Код выдан
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignatureChallenge" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/applications/{id}/signature/confirm:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
    post:
      tags: [applications]
      operationId: confirmSignature
      summary: Подтвердить подписание кодом (signing → signed)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignatureConfirm" }
      responses:
        "200":
          description: Договор подписан
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationDetail" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/applications/{id}/info-requests/{request_id}/respond:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
      - name: request_id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    post:
      tags: [applications]
      operationId: respondInfoRequest
      summary: Ответить на запрос (info_requested → submitted, если запросила проверка полноты; → manual_review, если сотрудник); документы — заранее через /documents
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InfoRequestResponse" }
      responses:
        "200":
          description: Ответ отправлен
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationDetail" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/applications/{id}/documents:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
    get:
      tags: [applications]
      operationId: listApplicationDocuments
      summary: Документы заявки
      responses:
        "200":
          description: Документы
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Document" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [applications]
      operationId: uploadApplicationDocument
      summary: Загрузить документ (только draft и info_requested; PDF, JPEG, PNG по сигнатуре; лимит размера)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/DocumentUpload" }
      responses:
        "201":
          description: Документ загружен
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }

  /api/applications/{id}/documents/{document_id}:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
      - $ref: "#/components/parameters/DocumentId"
    get:
      tags: [applications]
      operationId: downloadApplicationDocument
      summary: Скачать документ (всегда attachment, тип — определённый по сигнатуре)
      responses:
        "200":
          description: Файл
          headers:
            Content-Disposition:
              schema: { type: string }
              description: attachment; filename="…"
          content:
            application/pdf:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ───────────────────────────── notifications ─────────────────────────────
  /api/notifications:
    get:
      tags: [notifications]
      operationId: listNotifications
      summary: Уведомления (только в интерфейсе; фронт опрашивает раз в 15–30 с)
      parameters:
        - name: unread
          in: query
          schema: { type: boolean }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Страница уведомлений
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/notifications/{notification_id}/read:
    parameters:
      - name: notification_id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    post:
      tags: [notifications]
      operationId: markNotificationRead
      summary: Отметить прочитанным
      responses:
        "204": { description: Прочитано }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/notifications/read-all:
    post:
      tags: [notifications]
      operationId: markAllNotificationsRead
      summary: Отметить все прочитанными
      responses:
        "204": { description: Прочитано }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ───────────────────────────── bank ─────────────────────────────
  /api/bank/applications:
    get:
      tags: [bank]
      operationId: listBankApplications
      summary: Очередь банка с фильтрами, сортировкой, пагинацией и счётчиками по статусам
      parameters:
        - name: status
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/ApplicationStatus" }
        - name: product_kind
          in: query
          schema: { $ref: "#/components/schemas/ProductKind" }
        - name: grade
          in: query
          schema: { $ref: "#/components/schemas/Grade" }
        - name: assignee
          in: query
          description: "me — мои, none — никому не назначены, или id сотрудника"
          schema: { type: string, examples: [me] }
        - name: min_hours_in_status
          in: query
          schema: { type: integer, minimum: 0 }
        - name: overdue
          in: query
          description: true — только заявки, просроченные по нормативу статуса (SLA)
          schema: { type: boolean }
        - name: search
          in: query
          description: ИНН или название компании
          schema: { type: string, maxLength: 100 }
        - name: ordering
          in: query
          schema:
            type: string
            enum: [status_changed_at, -status_changed_at, requested_amount, -requested_amount, created_at, -created_at]
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Страница очереди
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankQueuePage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/bank/applications/{id}:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
    get:
      tags: [bank]
      operationId: getBankApplication
      summary: Карточка заявки для сотрудника — заявка, клиент, проверки, скоринг, решения, документы, журнал
      responses:
        "200":
          description: Карточка
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankApplicationDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/bank/applications/{id}/assign:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
    post:
      tags: [bank]
      operationId: assignBankApplication
      summary: Взять заявку себе (статус не меняется)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VersionedAction" }
      responses:
        "200":
          description: Назначена
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankApplicationDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/bank/applications/{id}/approve:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
    post:
      tags: [bank]
      operationId: approveBankApplication
      summary: Одобрить на запрошенных условиях (manual_review → offer)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VersionedAction" }
      responses:
        "200":
          description: Оффер выставлен
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankApplicationDetail" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/bank/applications/{id}/counteroffer:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
    post:
      tags: [bank]
      operationId: counterofferBankApplication
      summary: Иные условия и/или другой продукт (manual_review → offer; is_counteroffer / product_changed)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CounterofferAction" }
      responses:
        "200":
          description: Контроффер выставлен
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankApplicationDetail" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/bank/applications/{id}/request-info:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
    post:
      tags: [bank]
      operationId: requestInfoBankApplication
      summary: Запросить информацию или документ (manual_review → info_requested)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RequestInfoAction" }
      responses:
        "200":
          description: Запрос отправлен клиенту
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankApplicationDetail" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/bank/applications/{id}/decline:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
    post:
      tags: [bank]
      operationId: declineBankApplication
      summary: Отказать с причинами и «что улучшить» (manual_review → declined)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeclineAction" }
      responses:
        "200":
          description: Отказ оформлен
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankApplicationDetail" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/bank/applications/{id}/comments:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
    post:
      tags: [bank]
      operationId: commentBankApplication
      summary: Внутренний комментарий в журнал (клиенту не виден)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommentCreate" }
      responses:
        "201":
          description: Добавлен
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationEvent" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/bank/applications/{id}/assistant/messages:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
    get:
      tags: [bank, assistant]
      operationId: listBankAssistantMessages
      summary: История диалога сотрудника с ассистентом по заявке (журнал вызовов инструментов)
      responses:
        "200":
          description: Сообщения этого сотрудника по этой заявке, от старых к новым
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AssistantMessage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [bank, assistant]
      operationId: sendBankAssistantMessage
      summary: >-
        Сообщение ассистенту сотрудника (AI11). Инструменты только читают; pending_action всегда
        null: статус, решение и комментарий меняет сотрудник сам
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BankAssistantMessageRequest" }
      responses:
        "200":
          description: Ответ и вызванные инструменты
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantReply" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/bank/applications/{id}/assistant/summary:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
    post:
      tags: [bank, assistant]
      operationId: createBankAssistantSummary
      summary: >-
        «Сводка для решения» (И2а): риски по убыванию веса, что перепроверить, черновик
        комментария и источники. Ничего не сохраняет в заявке
      responses:
        "200":
          description: Сводка
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/bank/applications/{id}/documents/{document_id}:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
      - $ref: "#/components/parameters/DocumentId"
    get:
      tags: [bank]
      operationId: downloadBankApplicationDocument
      summary: Скачать документ заявки (сотрудник банка)
      responses:
        "200":
          description: Файл (attachment)
          content:
            application/pdf:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/bank/dashboard:
    get:
      tags: [bank]
      operationId: getBankDashboard
      summary: Воронка, время в статусах, доля автоматических решений
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 90, default: 30 }
      responses:
        "200":
          description: Метрики конвейера
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankDashboard" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ───────────────────────────── assistant ─────────────────────────────
  /api/assistant/messages:
    get:
      tags: [assistant]
      operationId: listAssistantMessages
      summary: История диалога с ассистентом (журнал вызовов инструментов)
      parameters:
        - name: application_id
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Сообщения
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AssistantMessage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [assistant]
      operationId: sendAssistantMessage
      summary: Сообщение ассистенту; инструменты работают от имени пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssistantMessageRequest" }
      responses:
        "200":
          description: Ответ, вызванные инструменты и действие на подтверждение
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantReply" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/assistant/actions/{action_id}/confirm:
    parameters:
      - name: action_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [assistant]
      operationId: confirmAssistantAction
      summary: Человек подтверждает действие, предложенное ассистентом
      responses:
        "200":
          description: Действие выполнено
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantActionResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ───────────────────────────── demo (stand only) ─────────────────────────────
  /api/demo/personas:
    get:
      tags: [demo]
      operationId: listDemoPersonas
      summary: Демо-персоны для быстрого входа
      security: []
      responses:
        "200":
          description: Персоны
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DemoPersona" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/demo/login:
    post:
      tags: [demo]
      operationId: demoLogin
      summary: Быстрый вход за персону
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [persona]
              additionalProperties: false
              properties:
                persona: { type: string, examples: [coffee_shop] }
      responses:
        "200":
          description: Вошли
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/demo/sources:
    get:
      tags: [demo]
      operationId: getDemoSources
      summary: Живой статус источников — сбой и circuit breaker (XP6, сотрудник банка)
      description: |
        Для демо-панели: по каждому из четырёх источников — включён ли сбой и когда погаснет сам
        (через 15 минут после включения), и состояние circuit breaker. Breaker общий для всех
        процессов стенда: три неудачных вызова подряд открывают его на 30 секунд, затем один
        пробный вызов (half_open), удачный — закрывает. Выключение сбоя закрывает breaker
        источника. Только на стенде (`DEMO_MODE=1`).
      responses:
        "200":
          description: Четыре источника в порядке egrul, transparent_business, bki, bank_account
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DemoSource" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/demo/failures:
    get:
      tags: [demo]
      operationId: getDemoFailures
      summary: Текущие флаги сбоев симуляторов
      responses:
        "200":
          description: Флаги
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DemoFailures" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [demo]
      operationId: setDemoFailures
      summary: Включить или выключить сбои симуляторов (сотрудник банка)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DemoFailures" }
      responses:
        "200":
          description: Флаги применены
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DemoFailures" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/demo/reset:
    post:
      tags: [demo]
      operationId: resetDemo
      summary: Сбросить демо-данные к засеянному состоянию (сотрудник банка)
      responses:
        "204": { description: Сброшено }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: sessionid

  parameters:
    ApplicationId:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    DocumentId:
      name: document_id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID, новый на каждое намерение отправить; повтор с тем же ключом не создаёт второй переход
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    ValidationError:
      description: Ошибка валидации (details — ошибки по полям)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error:
              code: invalid
              message: Проверьте введённые данные.
              details: { requested_amount: ["Обязательное поле."] }
    Unauthorized:
      description: Нужен вход
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: not_authenticated, message: Учётные данные не были предоставлены. } }
    Forbidden:
      description: Нет прав для этой роли или не прошла проверка CSRF
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: permission_denied, message: Недостаточно прав. } }
    NotFound:
      description: Не найдено (в том числе чужой объект)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: not_found, message: Не найдено. } }
    Conflict:
      description: invalid_transition — действие недопустимо в текущем статусе; version_conflict — заявку уже изменили
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: version_conflict, message: Заявку уже изменили. Обновите страницу. } }
    PayloadTooLarge:
      description: Файл больше лимита
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: payload_too_large, message: Файл больше допустимого размера. } }
    TooManyRequests:
      description: Слишком много запросов (троттлинг)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: throttled, message: Слишком много запросов. Попробуйте позже. } }
    SourceUnavailable:
      description: Внешний источник (симулятор) недоступен
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: source_unavailable, message: Реестр временно недоступен. Попробуйте позже. } }

  schemas:
    # ── primitives ──
    Money:
      type: string
      description: Сумма в рублях, строка-десятичная с копейками
      pattern: '^-?\d+(\.\d{1,2})?$'
      examples: ["900000.00"]
    Rate:
      type: string
      description: Годовая ставка в долях (0.24 = 24%)
      pattern: '^\d+(\.\d+)?$'
      examples: ["0.24"]
    DecimalString:
      type: string
      description: Десятичное число строкой (коэффициенты — 4 знака)
      pattern: '^-?\d+(\.\d+)?$'
      examples: ["1.2500"]
    Inn:
      type: string
      pattern: '^\d{10}(\d{2})?$'
      description: 10 цифр у ООО, 12 у ИП; контрольные цифры по алгоритму ФНС (неверные — 400)
      examples: ["0001000028"]
    Version:
      type: integer
      minimum: 0
      description: Версия заявки для optimistic locking; несовпадение → 409 version_conflict

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, examples: [not_found] }
            message: { type: string, description: Текст для пользователя (по-русски) }
            details:
              type: object
              description: Ошибки по полям
              additionalProperties: true

    Page:
      type: object
      required: [count, page, page_size]
      properties:
        count: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1 }

    # ── system ──
    Health:
      type: object
      required: [status, database]
      properties:
        status: { type: string, enum: [ok, degraded] }
        database: { type: string, enum: [ok, unavailable] }

    Readiness:
      type: object
      required: [status, components]
      properties:
        status: { type: string, enum: [ready, not_ready] }
        components:
          type: object
          additionalProperties: { type: string, enum: [ok, unavailable] }
          examples: [{ database: ok, queue: ok, simulators: ok }]

    # ── auth ──
    CsrfToken:
      type: object
      required: [csrf_token]
      properties:
        csrf_token: { type: string }

    LoginRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username: { type: string, minLength: 1, maxLength: 150 }
        password: { type: string, minLength: 1, maxLength: 128, format: password }

    RegisterRequest:
      type: object
      required: [username, password, full_name]
      additionalProperties: false
      properties:
        username: { type: string, minLength: 3, maxLength: 150, pattern: '^[\w.@+-]+$' }
        password: { type: string, minLength: 8, maxLength: 128, format: password }
        full_name: { type: string, minLength: 1, maxLength: 200 }

    UserKind:
      type: string
      enum: [client, bank]
      description: client — предприниматель; bank — сотрудник банка (bank_manager)

    MemberRole:
      type: string
      enum: [signatory, preparer]
      description: |
        Права в компании (кейс: собственник, директор, финдиректор, бухгалтер, иной уполномоченный).
        signatory — отправляет заявку, принимает оффер, подписывает (собственник, директор, уполномоченный по доверенности);
        preparer — готовит черновики, документы, отвечает на запросы банка (бухгалтер, финдиректор, сотрудник). Должность — в position.

    Me:
      type: object
      required: [id, username, full_name, kind, company_id, company_role, is_demo]
      properties:
        id: { type: integer, examples: [1] }
        username: { type: string, examples: [demo_coffee] }
        full_name: { type: string, examples: ["Анна Демо"] }
        kind: { $ref: "#/components/schemas/UserKind" }
        company_id:
          description: Компания клиента; null — ещё не создана или это сотрудник банка
          oneOf: [{ type: integer, examples: [1] }, { type: "null" }]
        company_role:
          oneOf: [{ $ref: "#/components/schemas/MemberRole" }, { type: "null" }]
        is_demo: { type: boolean }

    UserRef:
      type: object
      required: [id, full_name]
      properties:
        id: { type: integer, examples: [1] }
        full_name: { type: string, examples: ["Анна Демо"] }

    # ── company ──
    LegalForm:
      type: string
      enum: [ip, ooo]

    RegistryStatus:
      type: string
      enum: [active, liquidating, liquidated]

    RegistryRecord:
      type: object
      description: Запись ЕГРЮЛ/ЕГРИП из симулятора
      required: [inn, ogrn, legal_form, name, okved, okved_name, registered_at, region, address, registry_status, director_name]
      properties:
        inn: { $ref: "#/components/schemas/Inn" }
        ogrn: { type: string, pattern: '^\d{13}(\d{2})?$', examples: ["1267700000017"] }
        legal_form: { $ref: "#/components/schemas/LegalForm" }
        name: { type: string, examples: ["ООО «Демо Мебель»"] }
        okved: { type: string, examples: ["31.09"] }
        okved_name: { type: string, examples: ["Производство прочей мебели"] }
        registered_at: { type: string, format: date }
        region: { type: string, examples: ["Демо-область"] }
        address: { type: string, examples: ["г. Демо, ул. Примерная, 1"] }
        registry_status: { $ref: "#/components/schemas/RegistryStatus" }
        director_name: { type: string, examples: ["Иван Демо"] }

    Company:
      allOf:
        - $ref: "#/components/schemas/RegistryRecord"
        - type: object
          required: [id, is_demo, my_role, short_name, integrations]
          properties:
            id: { type: integer, examples: [1] }
            is_demo: { type: boolean, description: Синтетические данные — показываем пометку «демо» }
            my_role:
              description: Роль текущего пользователя в компании; null — смотрит сотрудник банка
              oneOf: [{ $ref: "#/components/schemas/MemberRole" }, { type: "null" }]
            short_name:
              description: Короткое название для интерфейса; null — показываем name из реестра (он не меняется)
              oneOf: [{ type: string, maxLength: 300, examples: ["Ромашка"] }, { type: "null" }]
            integrations: { $ref: "#/components/schemas/CompanyIntegrations" }

    CompanyIntegrations:
      type: object
      description: Что подключено — когда; null — не подключено (connectIntegration)
      required: [bank_account, edo]
      properties:
        bank_account:
          oneOf: [{ type: string, format: date-time }, { type: "null" }]
        edo:
          oneOf: [{ type: string, format: date-time }, { type: "null" }]

    CompanyCreate:
      type: object
      required: [inn]
      additionalProperties: false
      properties:
        inn: { $ref: "#/components/schemas/Inn" }

    CompanyUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        short_name:
          description: Короткое название для интерфейса; null или пустая строка — убрать. Реквизиты из реестра (name и др.) не меняются
          oneOf: [{ type: string, maxLength: 300 }, { type: "null" }]

    Member:
      type: object
      required: [id, user, role, position]
      properties:
        id: { type: integer, examples: [1] }
        user: { $ref: "#/components/schemas/UserRef" }
        role: { $ref: "#/components/schemas/MemberRole" }
        position: { type: string, examples: ["Главный бухгалтер"] }

    InvitationCreate:
      type: object
      required: [username, role, position]
      additionalProperties: false
      properties:
        username: { type: string, minLength: 1, maxLength: 150, pattern: '^[\w.@+-]+$' }
        role: { $ref: "#/components/schemas/MemberRole" }
        position: { type: string, minLength: 1, maxLength: 100 }

    Invitation:
      type: object
      description: Приглашение компании в том виде, как его отправил подписант
      required: [id, username, role, position, created_at]
      properties:
        id: { type: integer, examples: [1] }
        username: { type: string, examples: [demo_accountant] }
        role: { $ref: "#/components/schemas/MemberRole" }
        position: { type: string, examples: ["Главный бухгалтер"] }
        created_at: { type: string, format: date-time }

    IncomingInvitation:
      type: object
      description: Приглашение, адресованное текущему пользователю
      required: [id, company, role, position, invited_by, created_at]
      properties:
        id: { type: integer, examples: [1] }
        company:
          type: object
          required: [id, name, short_name, legal_form, inn]
          properties:
            id: { type: integer, examples: [1] }
            name: { type: string, examples: ["ООО «Демо Мебель»"] }
            short_name:
              oneOf: [{ type: string, maxLength: 300 }, { type: "null" }]
            legal_form: { $ref: "#/components/schemas/LegalForm" }
            inn: { $ref: "#/components/schemas/Inn" }
        role: { $ref: "#/components/schemas/MemberRole" }
        position: { type: string, examples: ["Главный бухгалтер"] }
        invited_by:
          description: Кто пригласил; null — его учётная запись удалена
          oneOf: [{ $ref: "#/components/schemas/UserRef" }, { type: "null" }]
        created_at: { type: string, format: date-time }

    SnapshotSource:
      type: string
      enum: [case, demo, simulator, manual]

    FinancialSnapshot:
      type: object
      description: Финансовый снимок компании за период. null — данных нет.
      required:
        - id
        - period
        - source
        - cleaned_credit_turnover
        - cfads
        - debt_service
        - revenue
        - cogs
        - ebitda
        - debt
        - cash
        - receivables
        - inventory
        - payables
        - counterparty_concentration
        - revenue_trend
      properties:
        id: { type: integer, examples: [1] }
        period: { type: string, pattern: '^\d{4}-\d{2}$', examples: ["2026-09"] }
        source: { $ref: "#/components/schemas/SnapshotSource" }
        cleaned_credit_turnover:
          description: Среднемесячный очищенный кредитовый оборот
          oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }]
        cfads:
          description: Денежный поток для обслуживания долга, в месяц
          oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }]
        debt_service:
          description: Текущие платежи по долгам, в месяц
          oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }]
        revenue: { oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }] }
        cogs: { oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }] }
        ebitda: { oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }] }
        debt: { oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }] }
        cash: { oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }] }
        receivables: { oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }] }
        inventory: { oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }] }
        payables: { oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }] }
        counterparty_concentration:
          oneOf: [{ $ref: "#/components/schemas/DecimalString" }, { type: "null" }]
        revenue_trend:
          oneOf: [{ $ref: "#/components/schemas/DecimalString" }, { type: "null" }]

    Reason:
      type: object
      description: Одна объяснённая проверка (AGENTS.md, «Деньги и расчёты»)
      required: [metric, value, threshold, passed, message]
      properties:
        metric: { type: string, examples: [dscr] }
        value:
          description: Значение метрики; null — посчитать нельзя (причина в message)
          oneOf: [{ $ref: "#/components/schemas/DecimalString" }, { type: "null" }]
        threshold:
          oneOf: [{ $ref: "#/components/schemas/DecimalString" }, { type: "null" }]
        passed: { type: boolean }
        message: { type: string, description: Текст для клиента, examples: ["Платежи по кредиту покрываются денежным потоком с запасом"] }

    CompanyMetrics:
      type: object
      required: [snapshot, metrics, is_demo]
      properties:
        snapshot:
          oneOf: [{ $ref: "#/components/schemas/FinancialSnapshot" }, { type: "null" }]
        metrics:
          type: array
          items: { $ref: "#/components/schemas/Reason" }
        is_demo: { type: boolean }

    IntegrationSource:
      type: string
      enum: [bank_account, edo]
      description: bank_account — выписка по счёту; edo — документы отгрузки (УПД)

    IntegrationConnectResult:
      type: object
      required: [source, status, is_demo, snapshot]
      properties:
        source: { $ref: "#/components/schemas/IntegrationSource" }
        status: { type: string, enum: [connected] }
        is_demo: { type: boolean, description: true — данные из симулятора }
        snapshot: { $ref: "#/components/schemas/FinancialSnapshot" }

    # ── products ──
    ProductKind:
      type: string
      enum: [overdraft, factoring, working_capital_loan, investment_loan, leasing]

    Product:
      type: object
      required:
        - code
        - kind
        - name
        - description
        - rate_min
        - rate_max
        - term_min_months
        - term_max_months
        - amount_min
        - amount_max
        - is_revolving
        - collateral_required
        - params
        - requirements
        - required_documents
      properties:
        code: { type: string, examples: [overdraft_basic] }
        kind: { $ref: "#/components/schemas/ProductKind" }
        name: { type: string, examples: ["Овердрафт для бизнеса"] }
        description: { type: string, examples: ["Закрывает кассовые разрывы до 60 дней"] }
        rate_min: { $ref: "#/components/schemas/Rate" }
        rate_max: { $ref: "#/components/schemas/Rate" }
        term_min_months: { type: integer, minimum: 1 }
        term_max_months: { type: integer, minimum: 1 }
        amount_min: { $ref: "#/components/schemas/Money" }
        amount_max: { $ref: "#/components/schemas/Money" }
        is_revolving: { type: boolean }
        collateral_required: { type: boolean }
        params:
          type: object
          description: Параметры продукта (alpha, beta, min_dscr, max_debt_to_ebitda, tranche_days…)
          additionalProperties: { $ref: "#/components/schemas/DecimalString" }
        requirements:
          type: object
          required: [min_business_age_months, legal_forms]
          properties:
            min_business_age_months: { type: integer, minimum: 0 }
            legal_forms:
              type: array
              items: { $ref: "#/components/schemas/LegalForm" }
        required_documents:
          type: array
          items: { $ref: "#/components/schemas/DocumentKind" }

    NeedType:
      type: string
      enum: [cash_gap, receivable_delay, working_capital, capex]
      description: |
        cash_gap — кассовый разрыв; receivable_delay — покупатель платит позже;
        working_capital — закупка, сезон; capex — оборудование, транспорт, недвижимость.

    RecommendationRequest:
      type: object
      required: [need_type]
      additionalProperties: false
      properties:
        need_type: { $ref: "#/components/schemas/NeedType" }
        amount: { $ref: "#/components/schemas/Money" }
        term_months: { type: integer, minimum: 1, maximum: 360 }
        invoice_amount:
          description: Для receivable_delay — сумма отгрузки по УПД
          allOf: [{ $ref: "#/components/schemas/Money" }]

    Offer:
      type: object
      required:
        - id
        - product
        - amount
        - requested_amount
        - term_months
        - rate
        - monthly_payment
        - is_counteroffer
        - product_changed
        - status
        - expires_at
        - reasons
      properties:
        id: { type: integer, examples: [1] }
        product: { $ref: "#/components/schemas/Product" }
        amount: { $ref: "#/components/schemas/Money" }
        requested_amount: { $ref: "#/components/schemas/Money" }
        term_months: { type: integer, minimum: 1 }
        rate: { $ref: "#/components/schemas/Rate" }
        monthly_payment:
          description: Для возобновляемых продуктов (овердрафт, факторинг) — null
          oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }]
        is_counteroffer: { type: boolean, description: Сумма или срок отличаются от запрошенных }
        product_changed: { type: boolean, description: Предложен другой продукт, чем в заявке }
        status: { type: string, enum: [active, accepted, declined, superseded] }
        expires_at: { type: string, format: date-time }
        reasons:
          type: array
          description: Почему именно эти условия (для контроффера — почему сумма меньше)
          items: { $ref: "#/components/schemas/Reason" }

    RecommendedOffer:
      type: object
      required: [rank, product, amount, term_months, rate, monthly_payment, fits, reasons]
      properties:
        rank: { type: integer, minimum: 1 }
        product: { $ref: "#/components/schemas/Product" }
        amount: { $ref: "#/components/schemas/Money" }
        term_months: { type: integer, minimum: 1 }
        rate: { $ref: "#/components/schemas/Rate" }
        monthly_payment:
          oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }]
        fits: { type: boolean, description: Все проверки пройдены }
        reasons:
          type: array
          items: { $ref: "#/components/schemas/Reason" }

    RecommendationResult:
      type: object
      required: [need_type, offers, stop_factors, is_preliminary]
      properties:
        need_type: { $ref: "#/components/schemas/NeedType" }
        offers:
          type: array
          items: { $ref: "#/components/schemas/RecommendedOffer" }
        stop_factors:
          type: array
          items: { $ref: "#/components/schemas/Reason" }
        is_preliminary: { type: boolean, const: true }

    WhatIfRequest:
      type: object
      required: [amount, term_months]
      additionalProperties: false
      properties:
        amount: { $ref: "#/components/schemas/Money" }
        term_months:
          type: integer
          minimum: 1
          maximum: 360
          description: В пределах срока продукта оффера, иначе 400

    WhatIfResult:
      type: object
      required: [amount, term_months, rate, monthly_payment, max_amount, dscr_after, min_dscr, fits, reasons]
      properties:
        amount: { $ref: "#/components/schemas/Money" }
        term_months: { type: integer, minimum: 1 }
        rate: { $ref: "#/components/schemas/Rate" }
        monthly_payment: { $ref: "#/components/schemas/Money" }
        max_amount:
          description: Допустимая сумма на этот срок; null — посчитать нельзя (причина в reasons)
          oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }]
        dscr_after:
          description: DSCR с новым платежом; null — посчитать нельзя
          oneOf: [{ $ref: "#/components/schemas/DecimalString" }, { type: "null" }]
        min_dscr: { $ref: "#/components/schemas/DecimalString" }
        fits: { type: boolean, description: Все проверки пройдены — такие условия прошли бы }
        reasons:
          type: array
          items: { $ref: "#/components/schemas/Reason" }

    AnnuityRequest:
      type: object
      required: [principal, annual_rate, term_months]
      additionalProperties: false
      properties:
        principal: { $ref: "#/components/schemas/Money" }
        annual_rate: { $ref: "#/components/schemas/Rate" }
        term_months: { type: integer, minimum: 1, maximum: 360 }

    ScheduleRow:
      type: object
      required: [number, payment, interest, principal, balance]
      properties:
        number: { type: integer, minimum: 1 }
        payment: { $ref: "#/components/schemas/Money" }
        interest: { $ref: "#/components/schemas/Money" }
        principal: { $ref: "#/components/schemas/Money" }
        balance: { $ref: "#/components/schemas/Money" }

    AnnuityResult:
      type: object
      required: [payment, total_paid, overpayment, schedule]
      properties:
        payment: { $ref: "#/components/schemas/Money" }
        total_paid: { $ref: "#/components/schemas/Money" }
        overpayment: { $ref: "#/components/schemas/Money" }
        schedule:
          type: array
          items: { $ref: "#/components/schemas/ScheduleRow" }

    # ── applications ──
    ApplicationStatus:
      type: string
      enum: [draft, submitted, processing, manual_review, info_requested, offer, signing, signed, issued, declined, cancelled]
      description: Переходы — docs/state-machine.md

    ApplicationAction:
      type: string
      enum:
        - edit
        - upload_document
        - submit
        - hand_off
        - cancel
        - respond_info
        - accept_offer
        - decline_offer
        - sign
        - assign
        - approve
        - counteroffer
        - request_info
        - decline

    PrefillSource:
      type: string
      enum: [manual, recommendation, assistant]

    Application:
      type: object
      required:
        - id
        - company_id
        - need_type
        - purpose
        - product_code
        - requested_amount
        - term_months
        - invoice_amount
        - collateral_description
        - status
        - version
        - prefill_source
        - available_actions
        - created_at
        - submitted_at
        - status_changed_at
      properties:
        id: { type: integer, examples: [1] }
        company_id: { type: integer, examples: [1] }
        need_type: { $ref: "#/components/schemas/NeedType" }
        purpose: { type: string, examples: ["Выплатить зарплату до поступления оплаты от клиентов"] }
        product_code:
          description: Код выбранного продукта; null до выбора
          oneOf: [{ type: string }, { type: "null" }]
        requested_amount: { $ref: "#/components/schemas/Money" }
        term_months: { type: integer, minimum: 1 }
        invoice_amount:
          description: Для факторинга — сумма отгрузки
          oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }]
        collateral_description:
          description: Залог или дополнительные условия (крупные проекты); null — без залога
          oneOf: [{ type: string }, { type: "null" }]
        status: { $ref: "#/components/schemas/ApplicationStatus" }
        version: { $ref: "#/components/schemas/Version" }
        prefill_source: { $ref: "#/components/schemas/PrefillSource" }
        available_actions:
          type: array
          description: Что текущий пользователь может сделать сейчас (по статусу и роли) — фронт рисует кнопки только по этому списку
          items: { $ref: "#/components/schemas/ApplicationAction" }
        created_at: { type: string, format: date-time }
        submitted_at:
          oneOf: [{ type: string, format: date-time }, { type: "null" }]
        status_changed_at: { type: string, format: date-time }

    ApplicationDetail:
      allOf:
        - $ref: "#/components/schemas/Application"
        - type: object
          required: [offer, open_info_requests, decision]
          properties:
            offer:
              description: Активный или принятый оффер; null — нет
              oneOf: [{ $ref: "#/components/schemas/Offer" }, { type: "null" }]
            open_info_requests:
              type: array
              items: { $ref: "#/components/schemas/InfoRequest" }
            decision:
              description: Последнее решение; null — ещё нет
              oneOf: [{ $ref: "#/components/schemas/Decision" }, { type: "null" }]

    ApplicationCreate:
      type: object
      required: [need_type, purpose, requested_amount, term_months]
      additionalProperties: false
      properties:
        need_type: { $ref: "#/components/schemas/NeedType" }
        purpose: { type: string, minLength: 1, maxLength: 1000 }
        requested_amount: { $ref: "#/components/schemas/Money" }
        term_months: { type: integer, minimum: 1, maximum: 360 }
        product_code: { type: string }
        invoice_amount: { $ref: "#/components/schemas/Money" }
        collateral_description: { type: string, maxLength: 1000 }
        prefill_source: { $ref: "#/components/schemas/PrefillSource" }

    ApplicationUpdate:
      type: object
      required: [version]
      minProperties: 2
      additionalProperties: false
      properties:
        version: { $ref: "#/components/schemas/Version" }
        need_type: { $ref: "#/components/schemas/NeedType" }
        purpose: { type: string, minLength: 1, maxLength: 1000 }
        requested_amount: { $ref: "#/components/schemas/Money" }
        term_months: { type: integer, minimum: 1, maximum: 360 }
        product_code:
          oneOf: [{ type: string }, { type: "null" }]
        invoice_amount:
          oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }]
        collateral_description:
          oneOf: [{ type: string, maxLength: 1000 }, { type: "null" }]

    ActorKind:
      type: string
      enum: [client, bank, system]

    EventKind:
      type: string
      enum:
        - status_changed
        - document_uploaded
        - info_requested
        - info_responded
        - assigned
        - check_completed
        - score_calculated
        - decision
        - comment
        - signed
        - issued
        - consent_given
        - handed_off

    ApplicationEvent:
      type: object
      required: [id, kind, from_status, to_status, actor_kind, actor, message, is_internal, created_at]
      properties:
        id: { type: integer, examples: [1] }
        kind: { $ref: "#/components/schemas/EventKind" }
        from_status:
          oneOf: [{ $ref: "#/components/schemas/ApplicationStatus" }, { type: "null" }]
        to_status:
          oneOf: [{ $ref: "#/components/schemas/ApplicationStatus" }, { type: "null" }]
        actor_kind: { $ref: "#/components/schemas/ActorKind" }
        actor:
          oneOf: [{ $ref: "#/components/schemas/UserRef" }, { type: "null" }]
        message: { type: string }
        is_internal: { type: boolean, description: true — только для банка }
        created_at: { type: string, format: date-time }

    DecisionOutcome:
      type: string
      enum: [offer, counteroffer, alternative_product, manual_review, info_requested, declined]
      description: |
        offer — одобрено на запрошенных условиях; counteroffer — иные сумма или срок;
        alternative_product — другой продукт; manual_review — нужен сотрудник;
        info_requested — нужны уточнения; declined — отказ (кейс: «итог не обязательно бинарный»).

    Decision:
      type: object
      required: [id, application_id, outcome, decided_by, is_preliminary, grade, policy_version, reasons, improvements, comment, created_at]
      properties:
        id: { type: integer, examples: [1] }
        application_id: { type: integer, examples: [1] }
        outcome: { $ref: "#/components/schemas/DecisionOutcome" }
        grade:
          description: Грейд скоринга, на который опиралось решение (скоринг ≠ решение); null — до скоринга (стоп-фактор, неполные данные)
          oneOf: [{ $ref: "#/components/schemas/Grade" }, { type: "null" }]
        policy_version: { type: string, description: Версия правил кредитной логики (decision-model.md), examples: ["2026.10-v1"] }
        decided_by:
          type: string
          enum: [auto, officer]
          description: auto — предварительная оценка системы; officer — сотрудник банка
        is_preliminary: { type: boolean, description: true для decided_by=auto }
        reasons:
          type: array
          items: { $ref: "#/components/schemas/Reason" }
        improvements:
          type: array
          description: «Что улучшить» — для отказа и контроффера
          items: { type: string, examples: ["Подключите выписку по расчётному счёту — оценка станет точнее"] }
        comment:
          description: Комментарий сотрудника для клиента
          oneOf: [{ type: string, examples: ["Одобрили сумму, которую выдерживает ваш денежный поток"] }, { type: "null" }]
        created_at: { type: string, format: date-time }
        approval_plan:
          description: |
            «Как получить одобрение» (XP2): для автоматического отказа по грейду ниже C — самый короткий
            набор шагов по факторам балльной карты, после которых грейд стал бы C. null — плана нет:
            отказ по стоп-фактору, решение сотрудника, грейд C и выше или цель недостижима
            изменяемыми факторами. Бэкенд отдаёт поле всегда.
          oneOf: [{ $ref: "#/components/schemas/ApprovalPlan" }, { type: "null" }]

    ApprovalPlan:
      type: object
      required: [current_total, target_total, target_grade, steps]
      properties:
        current_total: { type: integer, description: Баллы сейчас }
        target_total: { type: integer, description: Баллы после всех шагов }
        target_grade: { $ref: "#/components/schemas/Grade" }
        steps:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ApprovalStep" }

    ApprovalStep:
      type: object
      required: [metric, current, target, points, message]
      properties:
        metric: { type: string, description: Фактор балльной карты (ScoreFactor.name), examples: [counterparty_concentration] }
        current: { $ref: "#/components/schemas/DecimalString" }
        target: { $ref: "#/components/schemas/DecimalString" }
        points: { type: integer, minimum: 1, description: Сколько баллов добавит шаг }
        message: { type: string, description: Что сделать — простым языком, examples: ["Снизьте долю крупнейшего покупателя до 50 % и меньше (сейчас 80 %)"] }

    InfoRequest:
      type: object
      required: [id, origin, message, fields, document_kinds, status, response_message, created_at, answered_at]
      properties:
        id: { type: integer, examples: [1] }
        origin:
          type: string
          enum: [validation, officer]
          description: validation — автоматическая проверка полноты и корректности (F6); officer — сотрудник банка
        message: { type: string, description: "Что просит банк, простым языком", examples: ["Приложите выписку по счёту за последние 6 месяцев"] }
        fields:
          type: array
          description: Какие поля заявки или компании нужно уточнить (для origin=validation)
          items: { type: string, examples: [purpose] }
        document_kinds:
          type: array
          items: { $ref: "#/components/schemas/DocumentKind" }
        status: { type: string, enum: [open, answered] }
        response_message:
          oneOf: [{ type: string }, { type: "null" }]
        created_at: { type: string, format: date-time }
        answered_at:
          oneOf: [{ type: string, format: date-time }, { type: "null" }]

    SubmitRequest:
      type: object
      required: [bki_consent, consent_version]
      additionalProperties: false
      properties:
        bki_consent:
          type: boolean
          const: true
          description: Галочка «Согласен на запрос в бюро кредитных историй» на шаге «Проверка и отправка»
        consent_version:
          type: string
          maxLength: 32
          example: bki-2026-10
          description: Версия текста согласия, который видел клиент (frontend/src/texts). Устаревшая — 400
        version:
          allOf: [{ $ref: "#/components/schemas/Version" }]
          description: |
            Версия черновика, который подписант видел на шаге «Проверка и отправка». Если черновик
            успели изменить (бухгалтер в другой вкладке) — 409 version_conflict. Кабинет передаёт
            всегда; без поля версия не проверяется

    InfoRequestResponse:
      type: object
      required: [message]
      additionalProperties: false
      properties:
        message: { type: string, minLength: 1, maxLength: 2000 }

    SignatureChallenge:
      type: object
      required: [code, expires_at, attempts_left]
      properties:
        code: { type: string, pattern: '^\d{6}$', description: Показывается на экране — без SMS и почты, examples: ["482913"] }
        expires_at: { type: string, format: date-time }
        attempts_left: { type: integer, minimum: 0 }

    SignatureConfirm:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code: { type: string, pattern: '^\d{6}$', examples: ["482913"] }

    # ── documents ──
    DocumentKind:
      type: string
      enum: [bank_statement, financial_report, tax_return, contract, invoice, shipment_document, other]

    Document:
      type: object
      required: [id, kind, filename, content_type, size, sha256, uploaded_at, download_url]
      properties:
        id: { type: integer, examples: [1] }
        kind: { $ref: "#/components/schemas/DocumentKind" }
        filename: { type: string, description: Исходное имя (хранится под случайным именем), examples: ["vypiska-demo.pdf"] }
        content_type: { type: string, enum: [application/pdf, image/png, image/jpeg] }
        size: { type: integer, minimum: 1 }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$', examples: [e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855] }
        uploaded_at: { type: string, format: date-time }
        download_url: { type: string, description: Отдаётся как attachment, examples: ["/api/applications/1/documents/1"] }

    DocumentUpload:
      type: object
      required: [kind, file]
      properties:
        kind: { $ref: "#/components/schemas/DocumentKind" }
        file: { type: string, format: binary }

    # ── notifications ──
    Notification:
      type: object
      required: [id, kind, title, message, application_id, created_at, read_at]
      properties:
        id: { type: integer, examples: [1] }
        kind: { $ref: "#/components/schemas/EventKind" }
        title: { type: string, examples: ["Готово предложение"] }
        message: { type: string, examples: ["Банк одобрил овердрафт на 900 000 ₽"] }
        application_id:
          oneOf: [{ type: integer, examples: [1] }, { type: "null" }]
        created_at: { type: string, format: date-time }
        read_at:
          oneOf: [{ type: string, format: date-time }, { type: "null" }]

    NotificationPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [unread_count, results]
          properties:
            unread_count: { type: integer, minimum: 0 }
            results:
              type: array
              items: { $ref: "#/components/schemas/Notification" }

    # ── bank ──
    Grade:
      type: string
      enum: [A, B, C, D, E]

    CheckSource:
      type: string
      enum: [egrul, transparent_business, bki, bank_account]

    Check:
      type: object
      required:
        [source, status, summary, data, checked_at, received_at, response_sha256, simulator_version]
      properties:
        source: { $ref: "#/components/schemas/CheckSource" }
        status:
          type: string
          enum: [ok, warning, failed, unavailable, not_found, restricted, consent_missing]
          description: |
            ok, warning, failed — источник ответил; unavailable — источник не ответил (сценарий 7);
            not_found — ИНН нет в реестре (ЕГРЮЛ/ЕГРИП → отказ, стоп-фактор С2);
            restricted — источник ответил, но сведения скрыты (→ ручное рассмотрение);
            consent_missing — БКИ не запрашивали: нет согласия клиента (→ ручное рассмотрение).
            Нет данных — не отказ (SRC2).
        summary: { type: string }
        data: { type: object, additionalProperties: true }
        checked_at: { type: string, format: date-time }
        received_at:
          oneOf: [{ type: string, format: date-time }, { type: "null" }]
          description: |
            Происхождение (SRC4): когда пришёл ответ источника. null — источник не ответил
            (unavailable) или его не спрашивали (consent_missing); тогда null и два поля ниже.
        response_sha256:
          oneOf: [{ type: string, pattern: "^[0-9a-f]{64}$" }, { type: "null" }]
          description: |
            sha256 ответа источника — канонического JSON {status, data} (ключи по алфавиту,
            UTF-8, без пробелов). Тот же ответ — тот же хэш.
        simulator_version:
          oneOf: [{ type: string, examples: [datagen-2026.10-v1] }, { type: "null" }]
          description: Версия симулятора, который ответил (версия генератора синтетики)

    ScoreFactor:
      type: object
      required: [name, value, points, message]
      properties:
        name: { type: string, examples: [dscr] }
        value:
          description: Значение фактора числом-строкой; null — посчитать нельзя (причина в message)
          oneOf: [{ $ref: "#/components/schemas/DecimalString" }, { type: "null" }]
        points: { type: integer }
        message: { type: string }

    Score:
      type: object
      required: [grade, total, factors, model_version, created_at]
      properties:
        grade: { $ref: "#/components/schemas/Grade" }
        total: { type: integer }
        factors:
          type: array
          items: { $ref: "#/components/schemas/ScoreFactor" }
        model_version: { type: string }
        created_at: { type: string, format: date-time }

    BankQueueItem:
      type: object
      required:
        - id
        - company_name
        - company_inn
        - product_kind
        - requested_amount
        - status
        - grade
        - assignee
        - source_unavailable
        - status_changed_at
        - hours_in_status
        - sla_due_at
        - is_overdue
        - overdue_hours
        - version
      properties:
        id: { type: integer, examples: [1] }
        company_name: { type: string, examples: ["ИП Демо Кофейня"] }
        company_inn: { $ref: "#/components/schemas/Inn" }
        product_kind:
          oneOf: [{ $ref: "#/components/schemas/ProductKind" }, { type: "null" }]
        requested_amount: { $ref: "#/components/schemas/Money" }
        status: { $ref: "#/components/schemas/ApplicationStatus" }
        grade:
          oneOf: [{ $ref: "#/components/schemas/Grade" }, { type: "null" }]
        assignee:
          oneOf: [{ $ref: "#/components/schemas/UserRef" }, { type: "null" }]
        source_unavailable: { type: boolean, description: Хотя бы один источник не ответил }
        status_changed_at: { type: string, format: date-time }
        hours_in_status: { type: integer, minimum: 0 }
        sla_due_at:
          description: До какого момента заявка должна уйти из статуса по нормативу; null — у статуса нет норматива (ждём клиента или финал)
          oneOf: [{ type: string, format: date-time }, { type: "null" }]
        is_overdue: { type: boolean, description: Срок по нормативу прошёл }
        overdue_hours: { type: integer, minimum: 0, description: Сколько полных часов прошло после срока; 0 — не просрочено или меньше часа }
        version: { $ref: "#/components/schemas/Version" }

    BankQueuePage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [results, counters]
          properties:
            results:
              type: array
              items: { $ref: "#/components/schemas/BankQueueItem" }
            counters:
              type: object
              description: Количество заявок по статусам (без учёта фильтра по статусу)
              additionalProperties: { type: integer, minimum: 0 }
              examples: [{ manual_review: 12, info_requested: 3, offer: 7 }]

    BankApplicationDetail:
      type: object
      required: [application, company, members, snapshot, checks, score, decisions, offer, info_requests, documents, events, assignee]
      properties:
        application: { $ref: "#/components/schemas/Application" }
        company: { $ref: "#/components/schemas/Company" }
        members:
          type: array
          items: { $ref: "#/components/schemas/Member" }
        snapshot:
          oneOf: [{ $ref: "#/components/schemas/FinancialSnapshot" }, { type: "null" }]
        checks:
          type: array
          items: { $ref: "#/components/schemas/Check" }
        score:
          oneOf: [{ $ref: "#/components/schemas/Score" }, { type: "null" }]
        decisions:
          type: array
          items: { $ref: "#/components/schemas/Decision" }
        offer:
          oneOf: [{ $ref: "#/components/schemas/Offer" }, { type: "null" }]
        info_requests:
          type: array
          items: { $ref: "#/components/schemas/InfoRequest" }
        documents:
          type: array
          items: { $ref: "#/components/schemas/Document" }
        events:
          type: array
          description: Полный журнал, включая внутренние комментарии
          items: { $ref: "#/components/schemas/ApplicationEvent" }
        assignee:
          oneOf: [{ $ref: "#/components/schemas/UserRef" }, { type: "null" }]

    VersionedAction:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        version: { $ref: "#/components/schemas/Version" }
        comment: { type: string, maxLength: 2000, description: Комментарий для клиента }

    CounterofferAction:
      type: object
      required: [version, amount, term_months, rate, comment]
      additionalProperties: false
      properties:
        version: { $ref: "#/components/schemas/Version" }
        product_code: { type: string, description: Другой продукт; не указан — текущий }
        amount: { $ref: "#/components/schemas/Money" }
        term_months: { type: integer, minimum: 1, maximum: 360 }
        rate: { $ref: "#/components/schemas/Rate" }
        comment: { type: string, minLength: 1, maxLength: 2000 }

    RequestInfoAction:
      type: object
      required: [version, message]
      additionalProperties: false
      properties:
        version: { $ref: "#/components/schemas/Version" }
        message: { type: string, minLength: 1, maxLength: 2000 }
        document_kinds:
          type: array
          items: { $ref: "#/components/schemas/DocumentKind" }

    DeclineAction:
      type: object
      required: [version, reasons_text, improvements]
      additionalProperties: false
      properties:
        version: { $ref: "#/components/schemas/Version" }
        reasons_text: { type: string, minLength: 1, maxLength: 2000, description: Почему отказ — простым языком }
        improvements:
          type: array
          minItems: 1
          items: { type: string, minLength: 1, maxLength: 500 }

    CommentCreate:
      type: object
      required: [message]
      additionalProperties: false
      properties:
        message: { type: string, minLength: 1, maxLength: 2000 }

    BankDashboard:
      type: object
      required: [period_days, funnel, avg_hours_in_status, auto_decision_share, total_applications, sla_hours, sla_open_count, overdue_count, overdue_share]
      properties:
        period_days: { type: integer }
        total_applications: { type: integer, minimum: 0 }
        funnel:
          type: array
          description: Сколько заявок дошло до каждого этапа
          items:
            type: object
            required: [stage, count]
            properties:
              stage: { $ref: "#/components/schemas/ApplicationStatus" }
              count: { type: integer, minimum: 0 }
        avg_hours_in_status:
          type: object
          additionalProperties: { $ref: "#/components/schemas/DecimalString" }
        auto_decision_share:
          description: Доля решений без участия сотрудника (0..1); null — решений ещё нет
          oneOf: [{ $ref: "#/components/schemas/DecimalString" }, { type: "null" }]
        sla_hours:
          type: object
          description: Норматив в часах для статусов, где действует банк
          additionalProperties: { type: integer, minimum: 1 }
          examples: [{ submitted: 1, processing: 1, manual_review: 24, signed: 1 }]
        sla_open_count: { type: integer, minimum: 0, description: Заявок периода сейчас в статусах с нормативом }
        overdue_count: { type: integer, minimum: 0, description: Из них просрочено по нормативу }
        overdue_share:
          description: Доля просроченных среди sla_open_count (0..1); null — таких заявок нет
          oneOf: [{ $ref: "#/components/schemas/DecimalString" }, { type: "null" }]

    # ── assistant ──
    AssistantMessageRequest:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        text: { type: string, minLength: 1, maxLength: 2000 }
        application_id: { type: integer, minimum: 1 }

    AssistantToolCall:
      type: object
      required: [name, arguments, result]
      description: Запись журнала — что ассистент вызвал и что получил
      properties:
        name: { type: string, examples: [recommend_products] }
        arguments: { type: object, additionalProperties: true }
        result:
          oneOf: [{ type: object, additionalProperties: true }, { type: "null" }]

    PendingAction:
      type: object
      required: [id, kind, summary, application_id]
      description: Действие, которое выполнится только после подтверждения человеком
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [create_application, submit_application] }
        summary: { type: string, description: Что произойдёт — текстом для клиента }
        application_id:
          oneOf: [{ type: integer, examples: [1] }, { type: "null" }]

    AssistantMessage:
      type: object
      required: [id, role, content, tool_calls, created_at]
      properties:
        id: { type: integer, examples: [1] }
        role: { type: string, enum: [user, assistant] }
        content: { type: string, description: Простой текст без HTML }
        tool_calls:
          type: array
          items: { $ref: "#/components/schemas/AssistantToolCall" }
        created_at: { type: string, format: date-time }

    AssistantReply:
      type: object
      required: [reply, tool_calls, pending_action]
      properties:
        reply: { type: string, description: Простой текст без HTML }
        tool_calls:
          type: array
          items: { $ref: "#/components/schemas/AssistantToolCall" }
        pending_action:
          oneOf: [{ $ref: "#/components/schemas/PendingAction" }, { type: "null" }]

    BankAssistantMessageRequest:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        text: { type: string, minLength: 1, maxLength: 2000 }

    AssistantSummary:
      type: object
      required: [risks, to_verify, draft_comment, sources]
      description: >-
        «Сводка для решения» сотрудника (И2а). Каждая строка — из результатов инструментов;
        у риска в скобках источник (проверка или фактор скоринга)
      properties:
        risks:
          type: array
          maxItems: 8
          items: { type: string, examples: ["[риск] (скоринг: dscr)"] }
        to_verify:
          type: array
          maxItems: 8
          items: { type: string }
        draft_comment: { type: string, description: Текст, который сотрудник вставляет и правит сам }
        sources:
          type: array
          maxItems: 8
          items: { type: string, examples: ["скоринг: dscr"] }

    AssistantActionResult:
      type: object
      required: [action_id, status, application]
      properties:
        action_id: { type: string, format: uuid }
        status: { type: string, enum: [done] }
        application: { $ref: "#/components/schemas/ApplicationDetail" }

    # ── demo ──
    DemoPersona:
      type: object
      required: [code, title, username, scenario, kind]
      properties:
        code: { type: string, examples: [coffee_shop] }
        title: { type: string, examples: ["Кофейня, ИП (демо)"] }
        username: { type: string }
        scenario: { type: integer, minimum: 1, maximum: 8, description: Номер сценария из docs/plan.md (8 — D15) }
        kind: { $ref: "#/components/schemas/UserKind" }

    DemoSource:
      type: object
      required: [source, failing, failing_until, breaker]
      additionalProperties: false
      properties:
        source: { $ref: "#/components/schemas/CheckSource" }
        failing: { type: boolean, description: Сбой включён на демо-панели }
        failing_until:
          description: Когда сбой погаснет сам; null — сбоя нет
          oneOf: [{ type: string, format: date-time }, { type: "null" }]
        breaker:
          type: object
          required: [state, failures, open_until, last_failure_at]
          additionalProperties: false
          properties:
            state:
              type: string
              enum: [closed, open, half_open]
              description: |
                closed — вызовы идут; open — вызовов нет до open_until, источник сразу
                «не отвечает»; half_open — следующий вызов пробный
            failures: { type: integer, minimum: 0, description: Неудачных вызовов подряд }
            open_until:
              description: До какого момента breaker открыт; null — не открывался
              oneOf: [{ type: string, format: date-time }, { type: "null" }]
            last_failure_at:
              description: Последний неудачный вызов; null — с последнего успеха не было
              oneOf: [{ type: string, format: date-time }, { type: "null" }]

    DemoFailures:
      type: object
      required: [egrul, transparent_business, bki, bank_account]
      additionalProperties: false
      description: true — источник «падает» (симулятор отвечает ошибкой или таймаутом)
      properties:
        egrul: { type: boolean }
        transparent_business: { type: boolean }
        bki: { type: boolean }
        bank_account: { type: boolean }
