# Production stand on the VPS (docs/deploy.md). Only Caddy publishes ports (80/443):
# Docker bypasses UFW, so db, redis, backend and worker must never have `ports:`.
# On the server, .env sets COMPOSE_FILE=docker-compose.prod.yml, so plain `docker compose ...` works.
name: alfa-cabinet

# Every service: the json-file driver keeps at most 3 × 10 MB per container. Without a cap,
# gunicorn's access log and the JSON request log fill the VPS disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# One image for the backend and the Celery worker.
x-app: &app
  build:
    context: .
    dockerfile: backend/Dockerfile
    args:
      REQUIREMENTS: requirements.txt
  restart: unless-stopped
  env_file: .env
  logging: *logging

x-app-env: &app-env
  DJANGO_DEBUG: "0"
  CASE_DATA_DIR: /case-data
  # The pipeline and the disbursement go to the worker (apps/pipeline/tasks.py).
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
  # Demo stand: personas and /api/demo/* (docs/openapi.yaml). 0 in .env turns them off.
  DEMO_MODE: ${DEMO_MODE:-1}
  # Sign-in limits (docs/deploy.md): password login stays strict; demo personas and the
  # anonymous pages around them allow a jury switching personas from one IP.
  THROTTLE_LOGIN: ${THROTTLE_LOGIN:-10/min}
  THROTTLE_DEMO_LOGIN: ${THROTTLE_DEMO_LOGIN:-120/min}
  THROTTLE_ANON: ${THROTTLE_ANON:-300/min}

services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Celery broker only: no persistence (the application row is the state; a lost message is
  # picked up by apps/pipeline/recover.py), a hard memory cap, no ports.
  redis:
    image: redis:7.4.2-alpine
    restart: unless-stopped
    logging: *logging
    command:
      - redis-server
      - --maxmemory
      - 32mb
      - --maxmemory-policy
      - noeviction
      - --save
      - ""
      - --appendonly
      - "no"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    <<: *app
    environment: *app-env
    # The seed runs its pipeline in-process (empty broker): the worker starts after the backend.
    # gthread: an assistant turn waits for the model up to a minute; with sync workers three such
    # turns at once held every worker and the whole site hung. 3 × 8 threads, ≤ 24 DB connections.
    command: >
      sh -c "python manage.py migrate --noinput
      && CELERY_BROKER_URL= python manage.py seed_demo
      && python manage.py collectstatic --noinput
      && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --worker-class gthread --threads 8 --timeout 120 --no-control-socket --access-logfile -"
    volumes:
      - static:/app/staticfiles
      - media:/app/media
      - ${CASE_DATA_DIR:?set in .env (path outside the repo)}:/case-data:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Host must be in DJANGO_ALLOWED_HOSTS; /api/health is exempt from the HTTPS redirect.
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:8000/api/health', headers={'Host': os.environ['DOMAIN']}), timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  # The pipeline and the disbursement (apps/pipeline/celery_tasks.py). One worker per stand:
  # on start it finishes what a lost task left behind (apps/pipeline/recover.py).
  # After the backend: migrations are applied there.
  worker:
    <<: *app
    environment: *app-env
    command: celery -A config worker --loglevel INFO --concurrency 2 --without-gossip --without-mingle
    volumes:
      - ${CASE_DATA_DIR:?set in .env (path outside the repo)}:/case-data:ro
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping --destination celery@$$HOSTNAME --timeout 5 > /dev/null"]
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: 20s

  # Swagger UI for the contract (docs/openapi.yaml), served by Caddy at /api/docs (T7).
  swagger:
    restart: unless-stopped
    logging: *logging
    image: swaggerapi/swagger-ui:v5.17.14
    environment:
      BASE_URL: /api/docs
      SWAGGER_JSON: /spec/openapi.yaml
    volumes:
      - ./docs/openapi.yaml:/spec/openapi.yaml:ro

  caddy:
    build:
      context: .
      dockerfile: deploy/caddy/Dockerfile
    restart: unless-stopped
    logging: *logging
    environment:
      DOMAIN: ${DOMAIN:?set in .env}
      DJANGO_ADMIN_URL: ${DJANGO_ADMIN_URL:?set in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - static:/srv/static:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy
      swagger:
        condition: service_started

volumes:
  db-data:
  static:
  media:
  caddy-data:
  caddy-config:
