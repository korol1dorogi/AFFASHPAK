name: CI

on:
  push:
    branches: [main]
  pull_request:

# Only one secret: DEPLOY_SSH_KEY, used by the deploy job on main (docs/deploy.md).
# Third-party actions are pinned by commit SHA.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel main: a cancelled run could interrupt a deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: alfa
          POSTGRES_USER: alfa
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U alfa -d alfa"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # Throwaway values for tests only; real secrets never reach CI.
      DJANGO_SECRET_KEY: ci-only-not-a-secret-ci-only-not-a-secret-ci-only-not-a-secret
      DJANGO_DEBUG: "1"
      POSTGRES_DB: alfa
      POSTGRES_USER: alfa
      POSTGRES_PASSWORD: ci-only
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      LLM_PROVIDER: mock
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format --check
        run: ruff format --check .
      - name: pytest
        run: pytest
      - name: pytest (slow generator runs)
        run: pytest -m slow
      - name: manage.py check --deploy (production settings)
        run: |
          DJANGO_DEBUG=0 \
          DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(64))')" \
          DJANGO_ALLOWED_HOSTS=cabinet.example.com \
          python manage.py check --deploy --fail-level WARNING
      - name: migrations are in sync with models
        run: python manage.py makemigrations --check --dry-run

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: biome check
        run: npm run lint
      - name: tsc --noEmit
        run: npm run typecheck
      - name: vitest
        run: npm test
      - name: build
        run: npm run build
      - name: generated API client matches docs/openapi.yaml
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: start db + backend
        run: |
          cp .env.example .env
          docker compose up -d --build --wait
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: playwright
        run: npx playwright test
        working-directory: e2e
      - name: backend logs on failure
        if: failure()
        run: docker compose logs backend
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  collection:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: postman/package-lock.json
      - name: start db + backend
        run: |
          cp .env.example .env
          docker compose up -d --build --wait
      - run: npm ci
        working-directory: postman
      - name: newman
        run: npm test
        working-directory: postman
      - name: backend logs on failure
        if: failure()
        run: docker compose logs backend

  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: install gitleaks 8.30.1 (checksum-verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: scan full git history
        run: ./gitleaks git . --redact --verbose --exit-code 1

  # Auto-deploy after a merge to main, only when every check above is green.
  # The key is restricted on the server to command="/usr/local/bin/alfa-deploy":
  # it can only deploy the latest origin/main, nothing else (no shell, no forwarding).
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, e2e, collection, gitleaks]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      DEPLOY_HOST: 194.67.92.122
      # Server host key (public); pins the server so the runner cannot be pointed elsewhere.
      DEPLOY_KNOWN_HOST: 194.67.92.122 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIA9B3vAaYJMVQL8o10ho2IynfufH+vR3mn4dEleVEeV7
    steps:
      - name: deploy latest main to the VPS
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOST" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 "root@${DEPLOY_HOST}"
      - name: remove the key
        if: always()
        run: rm -f ~/.ssh/deploy_key
