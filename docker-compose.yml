# Local development and the jury run: db → init (migrate + seed) → redis → worker → backend → web.
# The frontend runs locally via npm (frontend/: npm run dev) and proxies /api to the backend;
# `web` serves the built SPA for a clean clone. Prism mock: --profile mock.
# All ports are bound to 127.0.0.1 only. Every long-running service has a healthcheck, so
# `docker compose up -d --wait` returns only when the cabinet really works.
name: alfa-cabinet

x-backend-env: &backend-env
  CASE_DATA_DIR: /case-data
  # The pipeline and the disbursement go to the worker through Redis (apps/pipeline/tasks.py).
  # Empty: they run in the request, as in tests.
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
  # Demo stand: personas and /api/demo/* (docs/openapi.yaml). 0 in .env turns them off.
  DEMO_MODE: ${DEMO_MODE:-1}
  # e2e signs in many times from one IP; the stand keeps the strict defaults (settings.py).
  THROTTLE_LOGIN: ${THROTTLE_LOGIN:-300/min}
  THROTTLE_ANON: ${THROTTLE_ANON:-1200/min}
  # Bind-mount of ./backend hides /app/media; /tmp is writable by the app user.
  MEDIA_ROOT: /tmp/media

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
    args:
      REQUIREMENTS: requirements-dev.txt
  env_file: .env
  environment: *backend-env
  volumes:
    - ./backend:/app
    - ./docs:/docs:ro
    - ${CASE_DATA_DIR:-./data/sample}:/case-data:ro

services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: schema, product catalog, demo personas and the bank queue (seed_demo is
  # idempotent). The backend starts only after it exited with 0.
  init:
    <<: *backend
    command: sh -c "python manage.py migrate --noinput && python manage.py seed_demo"
    environment:
      <<: *backend-env
      CELERY_BROKER_URL: ""  # the seed runs its pipeline in-process: no worker yet
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  # Celery broker only: no persistence (the application row is the state; a lost message is
  # picked up by apps/pipeline/recover.py), a hard memory cap for the 3 GB stand, no ports.
  redis:
    image: redis:7.4.2-alpine
    command:
      - redis-server
      - --maxmemory
      - 32mb
      - --maxmemory-policy
      - noeviction
      - --save
      - ""
      - --appendonly
      - "no"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # The pipeline and the disbursement (apps/pipeline/celery_tasks.py). One worker per stand:
  # on start it finishes what a lost task left behind (apps/pipeline/recover.py).
  # Code changes need `docker compose restart worker` — Celery does not autoreload.
  worker:
    <<: *backend
    command: celery -A config worker --loglevel INFO --concurrency 2 --without-gossip --without-mingle
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping --destination celery@$$HOSTNAME --timeout 5 > /dev/null"]
      interval: 10s
      timeout: 15s
      retries: 10
      start_period: 20s

  backend:
    <<: *backend
    command: sh -c "mkdir -p /tmp/media && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"  # set BACKEND_PORT in .env if 8000 is taken
    depends_on:
      db:
        condition: service_healthy
      init:
        condition: service_completed_successfully
      # `up db backend` (CI e2e) and `run backend` bring the worker along; pytest itself
      # never needs it (settings.TESTING).
      redis:
        condition: service_healthy
      worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # Swagger UI for the contract (docs/openapi.yaml), served by Caddy at /api/docs (T7).
  swagger:
    image: swaggerapi/swagger-ui:v5.17.14
    environment:
      BASE_URL: /api/docs
      SWAGGER_JSON: /spec/openapi.yaml
    volumes:
      - ./docs/openapi.yaml:/spec/openapi.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/docs/"]
      interval: 5s
      timeout: 3s
      retries: 20

  # The whole cabinet from a clean clone: the built SPA + /api through Caddy, plain HTTP.
  # Same image as the stand (deploy/caddy); for frontend work `npm run dev` stays faster.
  web:
    build:
      context: .
      dockerfile: deploy/caddy/Dockerfile
    environment:
      DOMAIN: ":80"  # a port instead of a host name: no TLS, no certificates locally
      DJANGO_ADMIN_URL: ${DJANGO_ADMIN_URL:-admin/}
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"  # set WEB_PORT in .env if 8080 is taken
    depends_on:
      backend:
        condition: service_healthy
      swagger:
        condition: service_healthy
    healthcheck:
      # Through Caddy to Django: the SPA and the API answer on one origin.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  mock:
    image: stoplight/prism:5.15.10
    profiles: ["mock"]
    command: mock -h 0.0.0.0 -p 4010 --multiprocess=false /docs/openapi.yaml
    volumes:
      - ./docs:/docs:ro
    ports:
      - "127.0.0.1:4010:4010"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4010/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  # AI4: a local open-weight model for a machine without GPU and without a key (README,
  # «Подключить модель»). `docker compose --profile llm up -d llm`, then in .env:
  # LLM_PROVIDER=openai, LLM_BASE_URL=http://llm:11434/v1, LLM_API_KEY=ollama,
  # LLM_MODEL=qwen3:4b-instruct,
  # LLM_TIMEOUT_SECONDS=180 — and restart backend. The weights download on the first start.
  # The instruct build answers without a long «thinking» part — on CPU that is minutes saved.
  llm:
    image: ollama/ollama:0.35.1
    profiles: ["llm"]
    entrypoint: ["/bin/sh", "/pull-and-serve.sh"]
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b-instruct}
      # the prompt and the tools take ~4k tokens; the default window would cut them
      OLLAMA_CONTEXT_LENGTH: 8192
      OLLAMA_KEEP_ALIVE: 24h
    volumes:
      - ollama-data:/root/.ollama
      - ./deploy/ollama/pull-and-serve.sh:/pull-and-serve.sh:ro
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama show \"$$OLLAMA_MODEL\" >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 900s

volumes:
  db-data:
  ollama-data:
